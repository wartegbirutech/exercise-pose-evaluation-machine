[project]
name = "exercise-pose-evaluation-machine"
version = "2.0.0"
description = "Fitcam: real-time exercise pose evaluation in a crowded environment using LSTM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2",
    "h5py>=3.11",
    "matplotlib>=3.8",
    "moviepy>=2.1",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pillow>=10",
    "pymongo>=4.8",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tensorflow>=2.17",  # Keras 3 via tf.keras
    "tf-slim>=1.1",      # only for deep_sort/tools/freeze_model.py
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pydot>=3"]  # for keras plot_model in the print_*_model scripts

[tool.uv]
package = false
